# Sites verified for automatic submission: an API or a plain form whose terms allow it,
# with no captcha and no account. Everything else is skipped and reported.

[[site]]
id = "betahunt.example"
method = "api"
endpoint = "https://betahunt.example/api/submit"
terms_url = "https://betahunt.example/terms"
terms_checked = "2026-10-01"
captcha = false
account = false
fields = { name = "{brand}", url = "{base_url}", tagline = "{tagline}", description = "{description}" }
