[project]
name = "growth-engine"
version = "0.1.0"
description = "A reusable, autonomous growth engine: scheduled jobs, generated search sites, waitlist, weekly digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
growth = "growth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["growth*"]

[tool.setuptools.package-data]
growth = ["assets/*.js", "themes/base/*.css", "waitlist/*.js", "waitlist/*.sql"]

[tool.ruff]
line-length = 130
target-version = "py311"
